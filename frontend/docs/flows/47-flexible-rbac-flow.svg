<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" dir="rtl">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2342"/>
      <stop offset="100%" stop-color="#123a63"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="#f8fafc" rx="16"/>

  <!-- Title -->
  <text x="500" y="45" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#0a2342" text-anchor="middle">
    مسار تقييم الصلاحيات الفعالة القطعي — Bayan Deterministic RBAC Hierarchy
  </text>
  <text x="500" y="70" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Order of Precedence: Scope Isolation &gt; User DENY &gt; User ALLOW &gt; Inherited Role ALLOW &gt; Implicit DENY
  </text>

  <!-- Step 1: Scope -->
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <rect width="800" height="75" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="8" height="75" fill="#0284c7" rx="4"/>
    <text x="760" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">1. فحص النطاق السيادي (Scope Boundary Check)</text>
    <text x="760" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#475569">عزل سيادي قطعي: مسؤول المنصة لا يدخل بيانات المؤسسة، والمستخدم المؤسسي لا يدير إعدادات المنصة.</text>
    <rect x="30" y="20" width="110" height="34" rx="6" fill="#fee2e2" stroke="#f87171"/>
    <text x="85" y="42" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">حجب فوري (DENY)</text>
  </g>

  <!-- Step 2: User DENY -->
  <g transform="translate(100, 195)" filter="url(#shadow)">
    <rect width="800" height="75" rx="10" fill="#fff" stroke="#fca5a5" stroke-width="2"/>
    <rect x="0" y="0" width="8" height="75" fill="#ef4444" rx="4"/>
    <text x="760" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#991b1b">2. استثناء الحجب الصريح للمستخدم (Explicit User DENY)</text>
    <text x="760" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#475569">الأولوية القصوى: ينقض (Veto) أي صلاحية موروثة من الأدوار الأساسية أو المخصصة.</text>
    <rect x="30" y="20" width="110" height="34" rx="6" fill="#ef4444"/>
    <text x="85" y="42" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">حجب صريح (⊘)</text>
  </g>

  <!-- Step 3: User ALLOW -->
  <g transform="translate(100, 290)" filter="url(#shadow)">
    <rect width="800" height="75" rx="10" fill="#fff" stroke="#86efac" stroke-width="2"/>
    <rect x="0" y="0" width="8" height="75" fill="#22c55e" rx="4"/>
    <text x="760" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#166534">3. استثناء المنح الصريح للمستخدم (Explicit User ALLOW)</text>
    <text x="760" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#475569">يمنح الصلاحية للمستخدم ضمن النطاق المصرح به حتى وإن لم تكن موروثة من دوره، مع اشتراط مبرر إداري.</text>
    <rect x="30" y="20" width="110" height="34" rx="6" fill="#22c55e"/>
    <text x="85" y="42" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">منح صريح (★)</text>
  </g>

  <!-- Step 4: Inherited Roles -->
  <g transform="translate(100, 385)" filter="url(#shadow)">
    <rect width="800" height="75" rx="10" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="0" y="0" width="8" height="75" fill="#3b82f6" rx="4"/>
    <text x="760" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#1e40af">4. تقييم التوريث من الأدوار المخصصة والأساسية (Inherited Roles)</text>
    <text x="760" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#475569">فحص الأدوار المخصصة المسندة ثم الدور الأساسي (employee, manager, it_admin, platform_admin).</text>
    <rect x="30" y="20" width="110" height="34" rx="6" fill="#3b82f6"/>
    <text x="85" y="42" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">منح موروث (✓)</text>
  </g>

  <!-- Step 5: Implicit Fallback -->
  <g transform="translate(100, 480)" filter="url(#shadow)">
    <rect width="800" height="75" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="8" height="75" fill="#64748b" rx="4"/>
    <text x="760" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#334155">5. الحجب الضمني الافتراضي (Default Implicit DENY — Zero Trust)</text>
    <text x="760" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#475569">إذا لم يطابق الطلب أي قاعدة سابقة، يُحجب المورد تلقائياً وفق مبدأ انعدام الثقة (Fail-Closed).</text>
    <rect x="30" y="20" width="110" height="34" rx="6" fill="#94a3b8"/>
    <text x="85" y="42" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">حجب موروث (✕)</text>
  </g>

  <!-- Footer Audit Note -->
  <g transform="translate(100, 580)">
    <rect width="800" height="45" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="500" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">
      كل عملية استثناء أو تعديل دور توثق لحظياً في سجل التدقيق (Live RBAC Audit Trail) مع معرّف الفاعل والهدف والتاريخ والسبب.
    </text>
  </g>
</svg>
