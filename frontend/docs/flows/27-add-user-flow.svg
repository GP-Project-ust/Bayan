" text-anchor="end" direction="rtl" unicode-bidi="plaintext" class="node-title">التحقق من البيانات</text><text x="532" y="649" text-anchor="end" direction="rtl" unicode-bidi="plaintext" class="node-sub">التنسيق وعدم التكرار</text><rect x="701" y="498" width="410" height="180" rx="23" fill="#DFEAF2"/><rect x="695" y="490" width="410" height="180" rx="23" fill="#fff" stroke="#DCE7F2" stroke-width="3"/><rect x="1029" y="510" width="57" height="47" rx="12" fill="#E5F6F8"/><text x="1058" y="542" text-anchor="middle" class="num">05</text><text x="1082" y="606" text-anchor="end" direction="rtl" unicode-bidi="plaintext" class="node-title">تحديد المؤسسة والدور</text><text x="1082" y="649" text-anchor="end" direction="rtl" unicode-bidi="plaintext" class="node-sub">القسم والدور المؤسسي</text><rect x="1251" y="498" width="410" height="180" rx="23" fill="#DFEAF2"/><rect x="1245" y="490" width="410" height="180" rx="23" fill="#fff" stroke="#DCE7F2" stroke-width="3"/><rect x="1579" y="510" width="57" height="47" rx="12" fill="#E5F6F8"/><text x="1608" y="542" text-anchor="middle" class="num">06</text><text x="1632" y="606" text-anchor="end" direction="rtl" unicode-bidi="plaintext" class="node-title">مراجعة البيانات</text><text x="1632" y="649" text-anchor="end" direction="rtl" unicode-bidi="plaintext" class="node-sub">قبل اعتماد الإضافة</text><rect x="1251" y="768" width="410" height="180" rx="23" fill="#DFEAF2"/><rect x="1245" y="760" width="410" height="180" rx="23" fill="#fff" stroke="#DCE7F2" stroke-width="3"/><rect x="1579" y="780" width="57" height="47" rx="12" fill="#E5F6F8"/><text x="1608" y="812" text-anchor="middle" class="num">07</text><text x="1632" y="876" text-anchor="end" direction="rtl" unicode-bidi="plaintext" class="node-title">تأكيد الإضافة</text><text x="1632" y="919" text-anchor="end" direction="rtl" unicode-bidi="plaintext" class="node-sub">نافذة موافقة</text><rect x="701" y="768" width="410" height="180" rx="23" fill="#DFEAF2"/><rect x="695" y="760" width="410" height="180" rx="23" fill="#fff" stroke="#DCE7F2" stroke-width="3"/><rect x="1029" y="780" width="57" height="47" rx="12" fill="#E5F6F8"/><text x="1058" y="812" text-anchor="middle" class="num">08</text><text x="1082" y="876" text-anchor="end" direction="rtl" unicode-bidi="plaintext" class="node-title">الحفظ المحلي</text><text x="1082" y="919" text-anchor="end" direction="rtl" unicode-bidi="plaintext" class="node-sub">إعادة التحقق ثم التخزين</text><rect x="151" y="768" width="410" height="180" rx="23" fill="#DFEAF2"/><rect x="145" y="760" width="410" height="180" rx="23" fill="#fff" stroke="#DCE7F2" stroke-width="3"/><rect x="479" y="780" width="57" height="47" rx="12" fill="#E5F6F8"/><text x="508" y="812" text-anchor="middle" class="num">09</text><text x="532" y="876" text-anchor="end" direction="rtl" unicode-bidi="plaintext" class="node-title">تأكيد النتيجة</text><text x="532" y="919" text-anchor="end" direction="rtl" unicode-bidi="plaintext" class="node-sub">العودة إلى قائمة المستخدمين</text>
<rect x="140" y="1010" width="1520" height="120" rx="20" fill="#E9F7F8" stroke="#BFE5E8" stroke-width="2"/><text x="1560" y="1059" class="node-title" text-anchor="end" direction="rtl" unicode-bidi="plaintext">حالات الرفض والمعالجة</text><text x="1560" y="1102" text-anchor="end" class="footer" direction="rtl" unicode-bidi="plaintext">لا صلاحية، أو مدخلات غير صالحة، أو بريد مكرر، أو تعذّر الحفظ: رسالة واضحة دون ادعاء النجاح</text>
