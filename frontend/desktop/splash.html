<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بيان | جاري بدء التشغيل...</title>
  <style>
    :root {
      --bayan-navy: #0A2342;
      --bayan-navy-dark: #06162B;
      --bayan-turquoise: #00A6B2;
      --bayan-turquoise-glow: rgba(0, 166, 178, 0.35);
      --bayan-surface: #F5F9FD;
      --bayan-text: #122B48;
      --bayan-text-muted: #52677F;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: linear-gradient(135deg, var(--bayan-navy-dark) 0%, var(--bayan-navy) 100%);
      color: #FFFFFF;
      font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .splash-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(0, 166, 178, 0.25);
      border-radius: 24px;
      padding: 48px 40px;
      width: 90%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 30px var(--bayan-turquoise-glow);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-app-region: no-drag;
    }

    .icon-wrap {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      background: linear-gradient(135deg, #0E2F56 0%, #06162B 100%);
      border: 2px solid var(--bayan-turquoise);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px var(--bayan-turquoise-glow);
      animation: pulse 2.2s infinite ease-in-out;
    }

    .icon-wrap img {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 8px 24px var(--bayan-turquoise-glow);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 12px 32px rgba(0, 212, 229, 0.5);
      }
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      background: linear-gradient(to left, #FFFFFF 40%, var(--bayan-turquoise) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 14px;
      color: #9BB3CE;
      margin-bottom: 28px;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
      position: relative;
    }

    .progress-indicator {
      position: absolute;
      top: 0;
      bottom: 0;
      background: linear-gradient(90deg, #00D4E5, #008B96);
      border-radius: 999px;
      width: 35%;
      animation: sweep 1.8s infinite ease-in-out;
    }

    @keyframes sweep {
      0% {
        left: -35%;
        width: 30%;
      }
      50% {
        width: 60%;
      }
      100% {
        left: 100%;
        width: 30%;
      }
    }

    .status-text {
      font-size: 13px;
      color: #7A98B8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00D4E5;
      display: inline-block;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="icon-wrap">
      <img src="assets/icon.png" alt="شعار بيان">
    </div>
    <h1>منصة بيان | Bayan</h1>
    <p class="subtitle">المساعد المؤسسي العربي الذكي</p>
    
    <div class="progress-bar-wrap">
      <div class="progress-indicator"></div>
    </div>
    
    <div class="status-text">
      <span class="dot"></span>
      <span id="status-label">جارٍ بدء خادم التطوير المحلي والاتصال بالشفرة الحية...</span>
    </div>
  </div>

  <script>
    if (window.bayanDesktop) {
      window.bayanDesktop.onStatus((message) => {
        const el = document.getElementById('status-label');
        if (el) el.textContent = message;
      });
    }
  </script>
</body>
</html>
